name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  gauntlet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # The packages declare >=8.4, so the floor is what is worth proving.
          php-version: '8.4'
          extensions: apcu
          # The Dockerfile sets this for the same reason: APCu is off on the CLI
          # by default and orange/cache throws rather than degrading quietly.
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Install dependencies
        # Resolves every orange/* package from the satis index at its current
        # published commit - so this run also catches a package that was pushed
        # without rebuilding that index.
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Recreate what the Docker entrypoint normally does
        # The entrypoint seeds .env and creates the writable var/ tree on first
        # start; a bare checkout has neither.
        run: |
          for d in logs cache uploads downloads temp working; do
            mkdir -p "var/$d"
          done
          chmod -R 777 var
          if [ ! -f .env ]; then
            sed -e '/^[[:space:]]*[;#]/d' env.sample > .env
          fi

      - name: composer.lock is level with the orange/* remotes
        # This job installs from the lock, so a package fix that has been pushed
        # but not re-locked is invisible here - CI keeps testing the older commit
        # and keeps passing. Five packages sat like that for a day, including a
        # framework fix whose own tests therefore never ran once.
        #
        # Runs before the gates rather than after: when it fails, everything
        # below it was measuring the wrong code anyway.
        run: composer lock:check

      - name: lint (phpcs, PSR-12)
        run: composer lint

      - name: type-check (PHPStan level 8)
        run: composer type-check

      - name: rector (dry run)
        # `composer rector` is already the --dry-run variant; rector:fix is the
        # one that writes. CI must fail on a needed refactor, not apply it.
        run: composer rector

      - name: generated TypeScript matches the Dto classes
        # The front end consumes these types as a package, so a Dto changed
        # without regenerating would leave the two languages disagreeing about
        # the same API with nothing to say so. Same guard the production config
        # snapshots would want.
        run: composer types:check

      - name: application tests
        run: composer test

      - name: framework core tests
        # The webapp installs every orange/* package, so a break anywhere
        # surfaces here even before that package's own CI reports it.
        run: composer test:orange

  publish-types:
    # Push the regenerated TypeScript to the api-types package the front end
    # installs, so a Dto change reaches it without anyone remembering to run
    # "composer types:publish" by hand. Only after the gauntlet passes.
    #
    # workflow_dispatch is allowed as well as push so this can be run on demand -
    # otherwise the only way to exercise it is to commit something. The ref check
    # still applies to both: a pull request, or a dispatch against a branch, must
    # not move a published package.
    needs: gauntlet
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Is the publish token configured?
        id: token
        # Secrets are not available to a job-level `if`, so the check happens
        # here and the rest of the job skips on the output. That way the
        # workflow stays green before the token exists rather than failing on
        # every push with a permissions error.
        run: |
          if [ -n "${{ secrets.API_TYPES_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API_TYPES_TOKEN is not set - skipping the publish to ProjectOrangeBox/api-types."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.token.outputs.present == 'true'
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check out the package repo
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: ProjectOrangeBox/api-types
          path: api-types
          token: ${{ secrets.API_TYPES_TOKEN }}

      - name: Regenerate and push when the types changed
        if: steps.token.outputs.present == 'true'
        run: |
          php bin/dtoExport
          cp types/api.d.ts api-types/index.d.ts
          cd api-types
          if git diff --quiet -- index.d.ts; then
            echo "api-types is already in step with the Dto classes - nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.d.ts
          git commit -m "regenerate from Orange-Application@${GITHUB_SHA:0:7}

          Published automatically by Orange-Application's CI after a Dto change.
          Do not edit index.d.ts here - it is generated by bin/dtoExport."
          git push
          echo "Published updated types to ProjectOrangeBox/api-types."
